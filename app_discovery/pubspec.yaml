name: app_discovery
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase packages
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.3.0

  # State Management
  provider: ^6.1.5+1

  # Image handling
  image_picker: ^1.0.0
  http: ^1.1.0
  cloudinary_flutter: ^1.0.0

  # URL handling
  url_launcher: ^6.2.0
  share_plus: ^10.0.0

  # Cloudinary integration
  crypto: ^3.0.3

  # Local storage for favorites and settings
  shared_preferences: ^2.2.0

  # Cache management
  flutter_cache_manager: ^3.3.1

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: any

  # Additional utilities
  package_info_plus: ^9.0.1
  path_provider: ^2.1.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/

